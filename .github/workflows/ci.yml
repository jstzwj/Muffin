name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  release-tooling:
    name: Release publication contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-release.txt
      - run: python scripts/test_publish_cnb_release.py
      - run: python scripts/test_check_macos_deployment.py

  test:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            conan-arch: x86_64
            configure-preset: conan-default
            conan-cppstd: 20
            test-command: ctest --preset conan-release --verbose
          - name: Windows ARM64
            runner: windows-11-arm
            conan-arch: armv8
            configure-preset: conan-default
            conan-cppstd: 20
            test-command: ctest --preset conan-release --verbose
          - name: macOS
            runner: macos-latest
            conan-profile: profiles/macos
            cache-platform: macOS-target-13.0
            conan-arch: armv8
            configure-preset: conan-release
            conan-cppstd: 20
            test-command: ctest --preset conan-release --verbose
          - name: Linux
            # Keep the compiler/libm baseline aligned with release and ASan.
            # ubuntu-latest moving to 26.04 changed Venn oracle coordinates.
            runner: ubuntu-24.04
            cache-platform: Linux-ubuntu-24.04
            conan-arch: x86_64
            configure-preset: conan-release
            conan-cppstd: gnu20
            test-command: xvfb-run ctest --preset conan-release --verbose

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # PySide6 6.10.2 requires Python < 3.15. Keep the tool runtime stable.
          python-version: '3.13'

      - name: Install Python tools
        run: python -m pip install --upgrade conan PySide6==6.10.2 -r requirements-build.txt

      # Cache ONLY Conan's package store. Never cache the whole ~/.conan2: the profile and
      # settings.yml describe the *current* runner image and must be regenerated by
      # `conan profile detect` on every run. A cached profile from an older windows-latest image
      # (e.g. one shipping VS 2022) gets restored on a newer image and makes CMake search for a VS
      # instance that no longer exists ("could not find any instance of Visual Studio"). Restore
      # the cache first so `--force` overwrites any stale state for the current image.
      - name: Restore Conan packages
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2/p
          # Include conan-arch in the key: x86_64 and armv8 Windows builds both
          # report runner.os == 'Windows', so without the arch segment they would
          # share one cache and restore the wrong-arch binaries on each other.
          key: conan-pkg-${{ matrix.cache-platform || runner.os }}-${{ matrix.conan-arch }}-${{ hashFiles('conanfile.py', 'conan.lock', 'profiles/*') }}
          restore-keys: |
            conan-pkg-${{ matrix.cache-platform || runner.os }}-${{ matrix.conan-arch }}-

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl-dev \
            libx11-dev \
            libx11-xcb-dev \
            libfontenc-dev \
            fonts-liberation \
            libice-dev \
            libsm-dev \
            libxau-dev \
            libxaw7-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxdamage-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbfile-dev \
            libxmu-dev \
            libxmuu-dev \
            libxpm-dev \
            libxrandr-dev \
            libxrender-dev \
            libxres-dev \
            libxss-dev \
            libxt-dev \
            libxtst-dev \
            libxv-dev \
            libxxf86vm-dev \
            libxcb-glx0-dev \
            libxcb-render0-dev \
            libxcb-render-util0-dev \
            libxcb-xkb-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-dri2-0-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-composite0-dev \
            libxcb-ewmh-dev \
            libxcb-res0-dev \
            libxcb-cursor-dev \
            libxcb-util-dev \
            uuid-dev \
            xvfb

      - name: Install dependencies
        run: conan install . --lockfile=conan.lock -pr:h ${{ matrix.conan-profile || 'default' }} -s build_type=Release -s compiler.cppstd=${{ matrix.conan-cppstd }} -s arch=${{ matrix.conan-arch }} --build=missing

      # Persist the package store right after `conan install` populates it: the binaries never
      # change during configure/build/test, so saving here survives a downstream failure. PRs only
      # restore, never save -- otherwise each PR forks its own per-branch copy and pushes the repo
      # past the 10 GB cache quota. Prune source/build/download temp dirs first so each entry stays
      # small (Qt's source/build folders are hundreds of MB and are only needed to build, not to
      # reuse the already-extracted binaries). Temporal flags only, never -f: -f would also delete
      # the binary packages we just installed.
      - name: Prune Conan cache
        if: github.event_name != 'pull_request'
        run: conan cache clean --source --build --download

      - name: Save Conan packages
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2/p
          key: conan-pkg-${{ matrix.cache-platform || runner.os }}-${{ matrix.conan-arch }}-${{ hashFiles('conanfile.py', 'conan.lock', 'profiles/*') }}
        continue-on-error: true   # exact-hit restores have nothing new to persist

      - name: Configure
        if: runner.os != 'Windows'
        run: cmake --preset ${{ matrix.configure-preset }}

      - name: Configure Windows with crash address maps
        if: runner.os == 'Windows'
        run: cmake --preset ${{ matrix.configure-preset }} -DCMAKE_SHARED_LINKER_FLAGS_RELEASE=/MAP -DCMAKE_EXE_LINKER_FLAGS_RELEASE=/MAP

      - name: Build Windows document visual tests
        if: runner.os == 'Windows'
        run: cmake --build --preset conan-release --target MuffinDocumentVisualAcceptanceTest

      - name: Test Windows document visuals
        if: runner.os == 'Windows'
        run: ctest --preset conan-release --verbose -R '^MuffinDocumentVisualAcceptance'

      - name: Build macOS integration and font raster tests
        if: runner.os == 'macOS'
        run: cmake --build --preset conan-release --target MuffinQuickLook MuffinQuickLookTest MuffinIcuWordBoundaryTest MuffinDocumentTabsTest MuffinSidebarInteractionTest MuffinFontMappingCompatibilityTest MuffinFractionalFontMappingCompatibilityTest MuffinCssPaintInteractionTest

      - name: Test macOS integration and font raster
        if: runner.os == 'macOS'
        run: ctest --preset conan-release --verbose -R 'Muffin(QuickLook|QuickLookRegistration|IcuWordBoundary|DocumentTabs|LazySessionView|SidebarInteraction|.*FontMappingCompatibility|.*CssPaintInteraction)Test'

      - name: Build
        run: cmake --build --preset conan-release

      - name: Verify macOS Quick Look bundle
        if: runner.os == 'macOS'
        run: |
          python scripts/check_macos_quicklook.py --bundle build/Release/Muffin.app
          python scripts/check_macos_deployment.py build/Release/Muffin.app --minimum-os 13.0

      - name: Verify bundled Math font contract
        run: ctest --preset conan-release --verbose -L math-font-oracle

      # Stream flushed RUN markers while each process is alive, including before a hang.
      - name: Test
        run: ${{ matrix.test-command }}

      - name: Diagnose macOS file-tree integration failures
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          for test in MuffinDocumentTabsTest MuffinSidebarInteractionTest; do
            (cd build/Release && QT_FONT_DPI=96 QT_QPA_PLATFORM=offscreen lldb --batch -o run -k 'thread backtrace all' -- "./$test") || true
          done
          find "$HOME/Library/Logs/DiagnosticReports" -name 'Muffin*' -type f -exec cat {} + || true

      - name: Capture Windows document visual crash
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $diagnostics = Join-Path $PWD 'build/crash-diagnostics'
          New-Item -ItemType Directory -Force $diagnostics | Out-Null
          Invoke-WebRequest https://download.sysinternals.com/files/Procdump.zip -OutFile "$diagnostics/procdump.zip"
          Expand-Archive -LiteralPath "$diagnostics/procdump.zip" -DestinationPath "$diagnostics/tools"
          $tool = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'procdump64a.exe' } else { 'procdump64.exe' }
          $ctest = ctest --preset conan-release --show-only=json-v1 | ConvertFrom-Json
          $test = $ctest.tests | Where-Object name -eq 'MuffinDocumentVisualAcceptanceTest'
          foreach ($property in $test.properties) {
            if ($property.name -eq 'ENVIRONMENT_MODIFICATION') {
              foreach ($modification in $property.value) {
                if ($modification -notmatch '^([^=]+)=(set|path_list_prepend):(.*)$') {
                  throw "Unsupported CTest environment modification: $modification"
                }
                $name, $action, $value = $Matches[1], $Matches[2], $Matches[3]
                if ($action -eq 'set') {
                  [Environment]::SetEnvironmentVariable($name, $value)
                } elseif ($action -eq 'path_list_prepend') {
                  [Environment]::SetEnvironmentVariable($name, "$value;$([Environment]::GetEnvironmentVariable($name))")
                } else {
                  throw "Unsupported CTest environment modification: $modification"
                }
              }
            }
          }
          $command = $test.command
          & "$diagnostics/tools/$tool" -accepteula -ma -e -x $diagnostics @command

      - name: Upload Windows crash dumps
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: crash-dumps-${{ matrix.name }}
          path: build/crash-diagnostics/*.dmp
          if-no-files-found: ignore

      - name: Upload pixel mismatch diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-diagnostics-${{ matrix.name }}
          path: build/**/resource-pixels-*.png
          if-no-files-found: ignore

      - name: Upload Windows crash address maps
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: crash-address-maps-${{ matrix.name }}
          path: build/Release/*.map
          if-no-files-found: ignore

      - name: Upload document visual acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-visuals-${{ matrix.name }}
          path: build/visual-acceptance/
          if-no-files-found: ignore

  # Blocking Linux build with AddressSanitizer. Memory errors are release
  # failures, even when they are nondeterministic in an unsanitized build.
  #
  # Qt stays Release (a RelWithDebInfo Conan install would force a ~30min Qt rebuild from source);
  # the sanitizer flags are added to OUR code only, and ASan's global allocator interceptors still
  # catch UAF/OOB across Qt and the third-party libs. `-g` carries line numbers into the report.
  #
  linux-asan:
    name: Linux ASan (blocking)
    # Use the same compiler/libm baseline as the Linux test and release jobs.
    runs-on: ubuntu-24.04
    env:
      # detect_leaks=0: Qt/threads trip the leak detector with noise. abort_on_error=1 lets ctest
      # see the fault as a failure; print_stacktrace=1 + symbolize=1 produce the actionable report.
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:print_stacktrace=1:symbolize=1
    steps:
      - name: Free runner disk
        # The sanitizer build's object files exhaust the default ~14GB free
        # space at link time ("final link failed: No space left on device"
        # landed at ~87%). Drop the largest preinstalled toolchains this job
        # never uses.
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift
          df -h /

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python tools
        run: python -m pip install --upgrade conan PySide6==6.10.2 -r requirements-build.txt

      - name: Restore Conan packages
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2/p
          key: conan-pkg-Linux-ubuntu-24.04-x86_64-${{ hashFiles('conanfile.py', 'conan.lock', 'profiles/*') }}
          restore-keys: |
            conan-pkg-Linux-ubuntu-24.04-x86_64-

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl-dev \
            libx11-dev \
            libx11-xcb-dev \
            libfontenc-dev \
            fonts-liberation \
            libice-dev \
            libsm-dev \
            libxau-dev \
            libxaw7-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxdamage-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbfile-dev \
            libxmu-dev \
            libxmuu-dev \
            libxpm-dev \
            libxrandr-dev \
            libxrender-dev \
            libxres-dev \
            libxss-dev \
            libxt-dev \
            libxtst-dev \
            libxv-dev \
            libxxf86vm-dev \
            libxcb-glx0-dev \
            libxcb-render0-dev \
            libxcb-render-util0-dev \
            libxcb-xkb-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-dri2-0-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-composite0-dev \
            libxcb-ewmh-dev \
            libxcb-res0-dev \
            libxcb-cursor-dev \
            libxcb-util-dev \
            uuid-dev \
            xvfb

      - name: Install dependencies
        run: conan install . --lockfile=conan.lock -s build_type=Release -s compiler.cppstd=gnu20 -s arch=x86_64 --build=missing

      - name: Configure (AddressSanitizer + debug info)
        run: |
          cmake --preset conan-release \
            -DMUFFIN_LIB_TYPE=SHARED \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g1" \
            -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address" \
            -DCMAKE_MODULE_LINKER_FLAGS="-fsanitize=address"

      - name: Build
        run: cmake --build --preset conan-release

      - name: Test (AddressSanitizer)
        run: xvfb-run ctest --preset conan-release --verbose

      - name: Upload pixel mismatch diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-diagnostics-linux-asan
          path: build/**/resource-pixels-*.png
          if-no-files-found: ignore
