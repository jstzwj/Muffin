name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            conan-arch: x86_64
            configure-preset: conan-default
            conan-cppstd: 20
            test-command: ctest --preset conan-release --output-on-failure
          - name: Windows ARM64
            runner: windows-11-arm
            conan-arch: armv8
            configure-preset: conan-default
            conan-cppstd: 20
            test-command: ctest --preset conan-release --output-on-failure
          - name: macOS
            runner: macos-latest
            conan-arch: armv8
            configure-preset: conan-release
            conan-cppstd: 20
            test-command: ctest --preset conan-release --output-on-failure
          - name: Linux
            runner: ubuntu-latest
            conan-arch: x86_64
            configure-preset: conan-release
            conan-cppstd: gnu20
            test-command: xvfb-run ctest --preset conan-release --output-on-failure

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python tools
        run: python -m pip install --upgrade conan PySide6==6.10.2

      # Cache ONLY Conan's package store. Never cache the whole ~/.conan2: the profile and
      # settings.yml describe the *current* runner image and must be regenerated by
      # `conan profile detect` on every run. A cached profile from an older windows-latest image
      # (e.g. one shipping VS 2022) gets restored on a newer image and makes CMake search for a VS
      # instance that no longer exists ("could not find any instance of Visual Studio"). Restore
      # the cache first so `--force` overwrites any stale state for the current image.
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          # Include conan-arch in the key: x86_64 and armv8 Windows builds both
          # report runner.os == 'Windows', so without the arch segment they would
          # share one cache and restore the wrong-arch binaries on each other.
          key: conan-pkg-${{ runner.os }}-${{ matrix.conan-arch }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-pkg-${{ runner.os }}-${{ matrix.conan-arch }}-

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl-dev \
            libx11-dev \
            libx11-xcb-dev \
            libfontenc-dev \
            libice-dev \
            libsm-dev \
            libxau-dev \
            libxaw7-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxdamage-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbfile-dev \
            libxmu-dev \
            libxmuu-dev \
            libxpm-dev \
            libxrandr-dev \
            libxrender-dev \
            libxres-dev \
            libxss-dev \
            libxt-dev \
            libxtst-dev \
            libxv-dev \
            libxxf86vm-dev \
            libxcb-glx0-dev \
            libxcb-render0-dev \
            libxcb-render-util0-dev \
            libxcb-xkb-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-dri2-0-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-composite0-dev \
            libxcb-ewmh-dev \
            libxcb-res0-dev \
            libxcb-cursor-dev \
            libxcb-util-dev \
            uuid-dev \
            xvfb

      - name: Install dependencies
        run: conan install . -s build_type=Release -s compiler.cppstd=${{ matrix.conan-cppstd }} -s arch=${{ matrix.conan-arch }} --build=missing

      - name: Configure
        run: cmake --preset ${{ matrix.configure-preset }}

      - name: Build
        run: cmake --build --preset conan-release

      - name: Test
        run: ${{ matrix.test-command }}
