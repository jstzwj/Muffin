name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            conan-arch: x86_64
            configure-preset: conan-default
            conan-cppstd: 20
            test-command: ctest --preset conan-release --output-on-failure
          - name: Windows ARM64
            runner: windows-11-arm
            conan-arch: armv8
            configure-preset: conan-default
            conan-cppstd: 20
            test-command: ctest --preset conan-release --output-on-failure
          - name: macOS
            runner: macos-latest
            conan-arch: armv8
            configure-preset: conan-release
            conan-cppstd: 20
            test-command: ctest --preset conan-release --output-on-failure
          - name: Linux
            runner: ubuntu-latest
            conan-arch: x86_64
            configure-preset: conan-release
            conan-cppstd: gnu20
            test-command: xvfb-run ctest --preset conan-release --output-on-failure

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python tools
        run: python -m pip install --upgrade conan PySide6==6.10.2

      # Cache ONLY Conan's package store. Never cache the whole ~/.conan2: the profile and
      # settings.yml describe the *current* runner image and must be regenerated by
      # `conan profile detect` on every run. A cached profile from an older windows-latest image
      # (e.g. one shipping VS 2022) gets restored on a newer image and makes CMake search for a VS
      # instance that no longer exists ("could not find any instance of Visual Studio"). Restore
      # the cache first so `--force` overwrites any stale state for the current image.
      - name: Restore Conan packages
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2/p
          # Include conan-arch in the key: x86_64 and armv8 Windows builds both
          # report runner.os == 'Windows', so without the arch segment they would
          # share one cache and restore the wrong-arch binaries on each other.
          key: conan-pkg-${{ runner.os }}-${{ matrix.conan-arch }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-pkg-${{ runner.os }}-${{ matrix.conan-arch }}-

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl-dev \
            libx11-dev \
            libx11-xcb-dev \
            libfontenc-dev \
            libice-dev \
            libsm-dev \
            libxau-dev \
            libxaw7-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxdamage-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbfile-dev \
            libxmu-dev \
            libxmuu-dev \
            libxpm-dev \
            libxrandr-dev \
            libxrender-dev \
            libxres-dev \
            libxss-dev \
            libxt-dev \
            libxtst-dev \
            libxv-dev \
            libxxf86vm-dev \
            libxcb-glx0-dev \
            libxcb-render0-dev \
            libxcb-render-util0-dev \
            libxcb-xkb-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-dri2-0-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-composite0-dev \
            libxcb-ewmh-dev \
            libxcb-res0-dev \
            libxcb-cursor-dev \
            libxcb-util-dev \
            uuid-dev \
            xvfb

      - name: Install dependencies
        run: conan install . -s build_type=Release -s compiler.cppstd=${{ matrix.conan-cppstd }} -s arch=${{ matrix.conan-arch }} --build=missing

      # Persist the package store right after `conan install` populates it: the binaries never
      # change during configure/build/test, so saving here survives a downstream failure. PRs only
      # restore, never save -- otherwise each PR forks its own per-branch copy and pushes the repo
      # past the 10 GB cache quota. Prune source/build/download temp dirs first so each entry stays
      # small (Qt's source/build folders are hundreds of MB and are only needed to build, not to
      # reuse the already-extracted binaries). Temporal flags only, never -f: -f would also delete
      # the binary packages we just installed.
      - name: Prune Conan cache
        if: github.event_name != 'pull_request'
        run: conan cache clean --source --build --download

      - name: Save Conan packages
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2/p
          key: conan-pkg-${{ runner.os }}-${{ matrix.conan-arch }}-${{ hashFiles('conanfile.txt') }}
        continue-on-error: true   # exact-hit restores have nothing new to persist

      - name: Configure
        run: cmake --preset ${{ matrix.configure-preset }}

      - name: Build
        run: cmake --build --preset conan-release

      - name: Test
        run: ${{ matrix.test-command }}

  # Diagnostic Linux build with AddressSanitizer. The render/inline-projection tests hit a
  # non-deterministic heap corruption that glibc reports only as a cryptic `free(): invalid size`.
  # ASan turns that into a precise use-after-free / heap-buffer-overflow report with file:line and
  # alloc/free stacks, so the offending site can be located and fixed.
  #
  # Qt stays Release (a RelWithDebInfo Conan install would force a ~30min Qt rebuild from source);
  # the sanitizer flags are added to OUR code only, and ASan's global allocator interceptors still
  # catch UAF/OOB across Qt and the third-party libs. `-g` carries line numbers into the report.
  #
  # continue-on-error: this job surfaces the report WITHOUT blocking PRs/releases (read its log when
  # it finds something). Flip to a normal blocking job once the corruption is fixed.
  linux-asan:
    name: Linux ASan (diagnostic)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # detect_leaks=0: Qt/threads trip the leak detector with noise. abort_on_error=1 lets ctest
      # see the fault as a failure; print_stacktrace=1 + symbolize=1 produce the actionable report.
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:print_stacktrace=1:symbolize=1
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python tools
        run: python -m pip install --upgrade conan PySide6==6.10.2

      - name: Restore Conan packages
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2/p
          key: conan-pkg-${{ runner.os }}-x86_64-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-pkg-${{ runner.os }}-x86_64-

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl-dev \
            libx11-dev \
            libx11-xcb-dev \
            libfontenc-dev \
            libice-dev \
            libsm-dev \
            libxau-dev \
            libxaw7-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxdamage-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbfile-dev \
            libxmu-dev \
            libxmuu-dev \
            libxpm-dev \
            libxrandr-dev \
            libxrender-dev \
            libxres-dev \
            libxss-dev \
            libxt-dev \
            libxtst-dev \
            libxv-dev \
            libxxf86vm-dev \
            libxcb-glx0-dev \
            libxcb-render0-dev \
            libxcb-render-util0-dev \
            libxcb-xkb-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-dri2-0-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-composite0-dev \
            libxcb-ewmh-dev \
            libxcb-res0-dev \
            libxcb-cursor-dev \
            libxcb-util-dev \
            uuid-dev \
            xvfb

      - name: Install dependencies
        run: conan install . -s build_type=Release -s compiler.cppstd=gnu20 -s arch=x86_64 --build=missing

      - name: Configure (AddressSanitizer + debug info)
        run: |
          cmake --preset conan-release \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
            -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address" \
            -DCMAKE_MODULE_LINKER_FLAGS="-fsanitize=address"

      - name: Build
        run: cmake --build --preset conan-release

      - name: Test (AddressSanitizer)
        run: xvfb-run ctest --preset conan-release --output-on-failure
