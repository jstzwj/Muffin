name: Diagnostics

# Manually-triggered probes for release-pipeline problems. These jobs build
# only small fixtures -- they exist so an environment-specific failure (tool install,
# package download, runner image drift) can be interrogated in minutes
# instead of through full release reruns.

on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'Which probe to run'
        required: true
        default: 'wix-extension'
        type: choice
        options:
          - wix-extension
          - update-bundle
          - dmg

jobs:
  dmg:
    name: DMG logical capacity probe
    if: inputs.probe == 'dmg'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package a sparse app payload
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/muffin-dmg-probe"
          mkdir -p "$probe/dist/Muffin.app/Contents/Frameworks"
          # Logical size, rather than allocated disk blocks, must determine
          # the image capacity. This also exercises a framework alias.
          mkfile -n 128m "$probe/dist/Muffin.app/Contents/Frameworks/payload.dylib"
          ln -s payload.dylib "$probe/dist/Muffin.app/Contents/Frameworks/alias.dylib"
          cd "$probe"
          cmake -DDIST_DIR="$probe/dist" -DMUFFIN_VERSION=0.0.1 \
            -DMACDEPLOYQT=/usr/bin/true -P "$GITHUB_WORKSPACE/cmake/BuildDMG.cmake"
          hdiutil verify Muffin-0.0.1-macos-arm64.dmg
          mkdir mounted
          hdiutil attach -readonly -nobrowse -mountpoint "$probe/mounted" Muffin-0.0.1-macos-arm64.dmg
          cmp dist/Muffin.app/Contents/Frameworks/payload.dylib mounted/Muffin.app/Contents/Frameworks/payload.dylib
          test "$(readlink mounted/Applications)" = /Applications
          test "$(readlink mounted/Muffin.app/Contents/Frameworks/alias.dylib)" = payload.dylib
          hdiutil detach "$probe/mounted"

  update-bundle:
    name: Update bundle probe ${{ matrix.arch }}
    if: inputs.probe == 'update-bundle'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          wix extension add WixToolset.UI.wixext/4.0.5 --global
          wix extension add WixToolset.Bal.wixext/4.0.5 --global
      - name: Build update entry probe
        shell: pwsh
        env:
          PROBE_ARCH: ${{ matrix.arch }}
        run: |
          $sourceRoot = $PWD.Path
          $probeRoot = Join-Path $env:RUNNER_TEMP 'muffin-bundle-probe'
          $probeDist = Join-Path $probeRoot 'dist'
          New-Item -ItemType Directory -Force -Path $probeRoot | Out-Null
          dotnet build tests/installer/IntegrationOptionsTest.csproj -c Release -o "$probeRoot/test" "-p:BaseIntermediateOutputPath=$probeRoot/obj/"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The invalid update request must exit before Detect/Plan/Apply.
          # Inert payloads keep this probe small and cannot run the editor.
          [xml]$msiSource = Get-Content cmake/Muffin.wxs -Raw
          foreach ($file in $msiSource.SelectNodes('//*[local-name()="File"]')) {
            $relative = $file.Source.Replace('$(var.DistDir)/', '')
            $path = Join-Path $probeDist $relative
            New-Item -ItemType Directory -Force -Path (Split-Path $path) | Out-Null
            [IO.File]::WriteAllText($path, 'Muffin installer probe; never installed.')
          }
          $wixPath = (Get-Command wix).Source
          $dotnetPath = (Get-Command dotnet).Source
          Push-Location $probeRoot
          try {
            cmake "-DSOURCE_DIR=$sourceRoot" "-DDIST_DIR=$probeDist" "-DWIX_COMMAND=$wixPath" "-DMSI_ARCH=$env:PROBE_ARCH" "-DMUFFIN_VERSION=0.0.1" -P "$sourceRoot/cmake/BuildMSI.cmake"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cmake "-DSOURCE_DIR=$sourceRoot" "-DDIST_DIR=$probeDist" "-DWIX_COMMAND=$wixPath" "-DDOTNET_COMMAND=$dotnetPath" "-DMSI_ARCH=$env:PROBE_ARCH" "-DMUFFIN_VERSION=0.0.1" -P "$sourceRoot/cmake/BuildBundle.cmake"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & "$probeRoot/test/IntegrationOptionsTest.exe" --update-bundle "$probeRoot/Muffin-Setup-0.0.1-windows-$env:PROBE_ARCH.exe"
            exit $LASTEXITCODE
          } finally { Pop-Location }
      - name: Upload bundle probe logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: update-bundle-probe-${{ matrix.arch }}
          path: ${{ runner.temp }}/MuffinBundleCommandTest-*/*.log
          if-no-files-found: ignore

  wix-extension:
    name: WiX UI extension install probe
    if: inputs.probe == 'wix-extension'
    runs-on: windows-latest
    steps:
      - name: Probe the WiX UI extension install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "=== dotnet environment ==="
          dotnet --list-sdks
          dotnet --list-runtimes

          Write-Host "=== install wix 4.0.5 ==="
          dotnet tool install --global wix --version 4.0.5

          Write-Host "=== wix extension add --global (all streams captured) ==="
          $addOut = & wix extension add WixToolset.UI.wixext/4.0.5 --global 2>&1 | Out-String
          Write-Host "add exit: $LASTEXITCODE"
          Write-Host "add output: [$addOut]"

          Write-Host "=== wix extension list ==="
          $listOut = & wix extension list 2>&1 | Out-String
          Write-Host "list exit: $LASTEXITCODE"
          Write-Host "list output: [$listOut]"

          Write-Host "=== ~/.wix tree ==="
          if (Test-Path "$HOME/.wix") {
            Get-ChildItem -Recurse "$HOME/.wix" | Select-Object -ExpandProperty FullName
          } else {
            Write-Host "(no ~/.wix was created)"
          }

          Write-Host "=== direct nupkg download probe (fallback channel) ==="
          try {
            Invoke-WebRequest `
              -Uri "https://www.nuget.org/api/v2/package/WixToolset.UI.wixext/4.0.5" `
              -OutFile "$env:TEMP/uiext.nupkg" -UseBasicParsing
            Write-Host ("nupkg download OK, {0} bytes" -f (Get-Item "$env:TEMP/uiext.nupkg").Length)
          } catch {
            Write-Host "nupkg download FAILED: $($_.Exception.Message)"
          }
